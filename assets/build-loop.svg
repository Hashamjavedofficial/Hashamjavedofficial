<svg xmlns="http://www.w3.org/2000/svg" width="640" height="112" viewBox="0 0 640 112" role="img" aria-labelledby="title desc">
  <title id="title">From interface to API to intelligence</title>
  <desc id="desc">A short typing animation: Built end to end. The same message stays visible when animation is unavailable or reduced motion is requested.</desc>
  <defs>
    <linearGradient id="edge" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <clipPath id="typing"><rect class="reveal" x="210" y="67" width="220" height="29"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .reveal{animation:type 3s steps(17,end) 1}
    .cursor{animation:blink 1s steps(2,end) 5}
    @keyframes type{from{width:0}to{width:220px}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.reveal,.cursor{animation:none}}
  </style>
  <rect x="1" y="1" width="638" height="110" rx="18" fill="#0d1117" stroke="#303b4d"/>
  <rect x="24" y="19" width="3" height="74" rx="1.5" fill="url(#edge)"/>
  <circle cx="601" cy="23" r="3" fill="#2dd4bf"/>
  <text x="320" y="48" fill="#e6edf3" font-size="21" text-anchor="middle">interface <tspan fill="#2dd4bf">→</tspan> API <tspan fill="#a78bfa">→</tspan> intelligence</text>
  <text x="320" y="86" fill="#9ee9db" font-size="20" text-anchor="middle" clip-path="url(#typing)">Built end to end.</text>
  <path class="cursor" d="M428 71v19" stroke="#a78bfa" stroke-width="2"/>
</svg>
